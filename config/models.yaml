    tool_use: true
    structured_output: true
    context_window: 1000000
    latency_score: 5.0
    cost_per_input_token: 0.005
    cost_per_output_token: 0.025
    reliability_score: 9.3
    max_reasoning_effort: max

  - name: claude-fable-5
    provider: anthropic
    tier: 4
    reasoning_score: 9.7
