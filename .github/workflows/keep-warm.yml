# Pings the deployed Render free-tier instance so it doesn't spin down between
# visits. Note: GitHub disables scheduled workflows after 60 days with no repo
# activity, so this needs a commit/push at least that often to keep firing.
name: keep-warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /models
        run: curl -fsS --max-time 60 https://routeiq-nwg4.onrender.com/models > /dev/null
      # Deliberately NOT /route. Every ping inserted a routing_records row --
      # ~120 synthetic rows a day permanently mixed into the telemetry NOTES.md
      # describes as the substrate for a future learned policy. /api warms the
      # same process without writing anything.
      - name: Ping /api
        run: curl -fsS --max-time 60 https://routeiq-nwg4.onrender.com/api > /dev/null
